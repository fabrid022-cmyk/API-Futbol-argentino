<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Posiciones - Fútbol Argentino</title>
    <link rel="stylesheet" href="futbol.css?v=2">
</head>
<body>
    <header>
        <h1>⚽ Tabla de Posiciones</h1>
        <p>Liga Profesional Argentina</p>
    </header>

    <main>
        <section id="clubes-container">
            <div id="loading" role="status">Cargando datos...</div>
            <div class="table-wrap">
                <table id="clubes-table" hidden>
                    <thead>
                        <tr>
                            <th class="num">#</th>
                            <th>Equipo</th>
                            <th class="num" title="Partidos jugados">PJ</th>
                            <th class="num" title="Ganados">G</th>
                            <th class="num" title="Empatados">E</th>
                            <th class="num" title="Perdidos">P</th>
                            <th class="num" title="Diferencia de gol">DG</th>
                            <th class="num" title="Puntos">Pts</th>
                            <th>Zona</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
        <p class="fuente" id="nota" hidden></p>
        <p class="fuente">Datos: <a href="https://www.thesportsdb.com/league/4406">TheSportsDB</a></p>
    </main>

    <script src="futbol.js?v=2"></script>
</body>
</html>
